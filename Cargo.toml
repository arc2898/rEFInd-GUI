[workspace]
resolver = "2"
members = [
    "refind-core",
    "refind-gui",
    "refind-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["User <user@example.com>"]
description = "rEFInd GUI - Comprehensive graphical manager for rEFInd boot manager"

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
walkdir = "2.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["serde", "v4"] }
num_cpus = "1.16"
hostname = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"

# System interaction
tokio = { version = "1.38", features = ["full", "macros"] }
async-process = "1.4"
nix = { version = "0.31", features = ["fs", "mount", "process", "signal"] }
libc = "0.2"

# Config parsing
pest = { version = "2.7", features = [] }
pest_derive = "2.7"

# GTK4 GUI
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_5"] }
gio = "0.22"
glib = { version = "0.22", features = ["v2_78"] }
gdk4 = "0.11"
pango = "0.22"
cairo-rs = { version = "0.19", features = ["v1_18", "png", "svg"] }

# Async GUI
async-channel = "2.2"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"

# Polkit
polkit = { version = "0.19" }

# Testing
tempfile = "3.8"
predicates = "3.0"
